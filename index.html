<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
         body {
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: #2b2b2b;
            line-height: 1.6;
            background-color: #f7f7f9;
        }
        header {
            text-align: center;
            padding-top: 40px;
        }
        header, main, footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
        }
         header h1 {
            font-size: 50px;
            color: #808080;
            margin-bottom: 8px;
        }
         #aa p, h2{
            text-align: center;
         }
         #bb p{
            text-align: center;
         }
         #cc p{
            text-align: center;
         }
         #dd p{
            text-align: center;
         }
         section, article {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        section h2, article h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #2c3e91;
        }
        form label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 4px;
        }

        form button {
            background-color: #2c3e91;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        form button:hover {
            background-color: #1f2c6e;
        }
        footer {
            text-align: center;
            color: #777;
            font-size: 14px;
            padding-bottom: 40px;
        }

        footer a {
            color: #2c3e91;
        }
    </style>
</head>
<body>
    <header>
            <h1>자기소개 페이지</h1>
    </header>

    <main>
        <section id="aa">
                <p> 안녕하십니까 개발자를 꿈꾸고있는 지민제입니다.🙋‍♂️👋</p>
                <p> 대전보건대학교 컴퓨터정보학과 4학년 재학중이며, 부족하지만 많이 배우며 성장하고싶습니다.</p>
        </section>

        <section id="bb">
                <h2> ⚙️ 기술 스택 </h2>
                    <p><img src="Python.PNG" width="70"></p>
                    <p>- Python -</p><br>
                    <p><img src="SQL.PNG" width="50"></p>
                    <p>- SQL -</p>
        </section>
        
        <section id="cc">
                <h2> 취미 </h2>
                    <p><img src="OW.PNG" width="70"></p>
                    <p>- 게임 -</p><br>
                    <p><img src="WT.PNG" width="70"></p>
                    <p>- 웹툰 보기 -</p>
        </section>

        <section id="dd">
                <h2>자격증</h2>
                    <p>X</p>
        </section>
        <section id="ee">
            <h2> 방명록 </h2>

            <form>
                <div>
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
                </div>

                <br>

                <div>
                    <label for="message">내용</label>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="메시지를 입력하세요"></textarea>
                </div>

                <br>

                <button type="submit" id="submit-btn">등록</button>
                <!-- type="button"은 기본 제출 동작이 없는 일반 버튼입니다. -->
                <button type="button" id="save-storage-btn" style="background-color: #4caf50; margin-left: 8px;">영구저장</button>
            </form>
                <div id="guestbook-list-container">
                    <h3> 등록된 방명록 목록</h3>
                    <p id="no-guestbook" style="text-align: center; color: #888; font-style: italic; padding: 16px 0;">아직 등록된 방명록이 없습니다.</p>
                    <ul id="guestbook-list" style="list-style: none; margin-left: 0;"></ul>
                </div>
        </section>
    </main>

        <footer>
            <p>© 2026 지민제 </p>
            <p>Phone : 010 - 4482 - **** </p>
            <p>Email : alswp1342@gmail.com</p>
        </footer>

        <script>
             let guestbooks = [];

            // DOM 엘리먼트들을 취득합니다.
            const guestbookForm = document.querySelector('#ee form');
            const nameInput = document.getElementById('name');
            const messageInput = document.getElementById('message');
            const guestbookList = document.getElementById('guestbook-list');
            const noGuestbookMsg = document.getElementById('no-guestbook');
            const saveStorageBtn = document.getElementById('save-storage-btn');

            // 화면에 방명록 배열(guestbooks)을 다시 그리는(렌더링) 함수입니다.
            function renderGuestbooks() {
                // 기존 리스트 내부를 깨끗이 비웁니다.
                guestbookList.innerHTML = '';

                // 방명록이 하나도 없는 경우 "등록된 방명록이 없습니다" 메시지를 띄웁니다.
                if (guestbooks.length === 0) {
                    noGuestbookMsg.style.display = 'block';
                    return;
                }

                // 방명록이 존재하면 메시지를 숨깁니다.
                noGuestbookMsg.style.display = 'none';

                // 배열을 순회하며 HTML 요소를 동적으로 생성해 화면에 추가합니다.
                guestbooks.forEach((item, index) => {
                    // <li> 태그 생성
                    const li = document.createElement('li');
                    li.className = 'guestbook-item';

                    // 이름 영역 <div> 생성 및 텍스트 대입
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'guestbook-name';
                    // textContent를 사용해 XSS(크로스 사이트 스크립팅) 공격을 예방합니다. (HTML 태그가 실행되지 않고 텍스트 그대로 노출됨)
                    nameDiv.textContent = item.name + ' 님';

                    // 내용 영역 <div> 생성 및 텍스트 대입
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'guestbook-message';
                    msgDiv.textContent = item.message;

                    // 개별 삭제(X) 버튼 생성
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = '×';
                    deleteBtn.title = '방명록 삭제';

                    // 삭제 버튼 클릭 이벤트 등록
                    deleteBtn.addEventListener('click', () => {
                        // 사용자에게 진짜 삭제할 것인지 묻습니다 (confirm 메서드 사용)
                        if (confirm(`'${item.name}' 님의 방명록을 삭제하시겠습니까?`)) {
                            // 배열.splice(인덱스, 개수)를 사용하여 메모리 상의 배열에서 해당 아이템을 제거합니다.
                            guestbooks.splice(index, 1);
                            
                            // 삭제 완료 후 로컬 스토리지 데이터도 함께 동기화하여 갱신합니다.
                            // 이렇게 동기화해 주어야 새로고침해도 삭제된 상태가 유지됩니다.
                            localStorage.setItem('savedGuestbooks', JSON.stringify(guestbooks));
                            
                            // 변경된 메모리 상태를 토대로 화면을 재렌더링합니다.
                            renderGuestbooks();
                        }
                    });

                    // 생성한 이름, 내용, 삭제 버튼 요소를 <li>의 자식으로 추가
                    li.appendChild(nameDiv);
                    li.appendChild(msgDiv);
                    li.appendChild(deleteBtn);

                    // 최종 완성된 <li>를 <ul> 목록에 추가
                    guestbookList.appendChild(li);
                });
            }

            // [기능 A] 방명록 임시 등록 기능
            guestbookForm.addEventListener('submit', (event) => {
                // <form>의 submit 이벤트는 기본적으로 페이지를 새로고침시킵니다.
                // 이를 방지하기 위해 event.preventDefault()를 반드시 사용해 줍니다.
                event.preventDefault();

                // 입력값 가져오기 (공백 제거: trim())
                const name = nameInput.value.trim();
                const message = messageInput.value.trim();

                // 입력 유효성 검사
                if (!name || !message) {
                    alert('이름과 내용을 모두 입력해 주세요!');
                    return;
                }

                // [바닐라 JS 개념] unshift()는 자바스크립트 표준 배열 내장 메서드입니다.
                // push()가 배열의 맨 뒤에 데이터를 넣는 반면, unshift()는 배열의 맨 앞(0번 인덱스)에 데이터를 삽입합니다.
                // 이를 통해 방금 등록한 최신 방명록이 목록의 맨 위에 보이도록 정렬합니다.
                guestbooks.unshift({ name, message });

                // 화면 갱신
                renderGuestbooks();

                // 입력 필드 초기화
                nameInput.value = '';
                messageInput.value = '';

                alert('방명록이 등록되었습니다. (새로고침 시 사라집니다. 영구적으로 저장하려면 우측의 [영구저장] 버튼을 눌러주세요!)');
            });

            // [기능 B] 로컬 스토리지에 영구 저장 기능
            saveStorageBtn.addEventListener('click', () => {
                // 현재 입력창에 작성 중인 값을 가져옵니다. (공백 제거: trim())
                const name = nameInput.value.trim();
                const message = messageInput.value.trim();

                // 1. 이름과 내용이 모두 작성되어 있는 경우: 목록에 추가하고 즉시 영구 저장합니다.
                if (name && message) {
                    // [바닐라 JS 개념] unshift()를 사용하여 입력한 새로운 방명록을 배열 맨 앞(인덱스 0)에 삽입합니다.
                    guestbooks.unshift({ name, message });
                    
                    // 입력 필드를 비워줍니다.
                    nameInput.value = '';
                    messageInput.value = '';
                } 
                // 2. 이름이나 내용 중 하나만 입력된 경우: 불완전한 상태이므로 입력을 마저 완료하도록 안내합니다.
                else if (name || message) {
                    alert('이름과 내용을 모두 입력한 후 영구저장 버튼을 눌러주세요!');
                    return;
                }
                // 3. 둘 다 비어있는 경우: 기존에 "등록" 버튼을 통해 임시로 등록해둔 목록들만 
                //    로컬 스토리지에 보존(동기화)하는 동작을 수행하게 됩니다.

                // 브라우저의 localStorage는 텍스트(문자열) 데이터만 저장할 수 있습니다.
                // 배열/객체 데이터를 저장하기 위해 JSON.stringify()를 사용하여 문자열로 직렬화(Serialization)합니다.
                localStorage.setItem('savedGuestbooks', JSON.stringify(guestbooks));
                
                // 화면 목록을 즉시 갱신합니다. (새로고침 하지 않더라도 화면에서 바로 확인 가능)
                renderGuestbooks();

                alert('방명록 목록이 브라우저 스토리지에 영구 저장되었습니다! 새로고침해도 유지됩니다.');
            });

            // [기능 C] 초기 로드 시 로컬 스토리지에서 데이터 불러오기
            function loadSavedGuestbooks() {
                const savedData = localStorage.getItem('savedGuestbooks');
                if (savedData) {
                    try {
                        // 저장되어 있던 문자열을 JSON.parse()를 통해 다시 자바스크립트 객체/배열로 역직렬화(Deserialization)합니다.
                        guestbooks = JSON.parse(savedData);
                        renderGuestbooks();
                    } catch (e) {
                        console.error('데이터 파싱 오류:', e);
                    }
                }
            }

            // 페이지가 열렸을 때 기존에 저장된 데이터 로딩 실행
            loadSavedGuestbooks();
        </script>
</body>
</html>
