<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
         body {
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: #2b2b2b;
            line-height: 1.6;
            background-color: #f7f7f9;
        }
        header {
            text-align: center;
            padding-top: 40px;
        }
        header, main, footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
        }
         header h1 {
            font-size: 50px;
            color: #808080;
            margin-bottom: 8px;
        }
         #aa p, h2{
            text-align: center;
         }
         #bb p{
            text-align: center;
         }
         #cc p{
            text-align: center;
         }
         #dd p{
            text-align: center;
         }
         section, article {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        section h2, article h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #2c3e91;
        }
        form label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 4px;
        }

        form button {
            background-color: #2c3e91;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        form button:hover {
            background-color: #1f2c6e;
        }
        footer {
            text-align: center;
            color: #777;
            font-size: 14px;
            padding-bottom: 40px;
        }

        footer a {
            color: #2c3e91;
        }
    </style>
</head>
<body>
    <header>
            <h1>자기소개 페이지</h1>
    </header>

    <main>
        <section id="aa">
                <p> 안녕하십니까 개발자를 꿈꾸고있는 지민제입니다.🙋‍♂️👋</p>
                <p> 대전보건대학교 컴퓨터정보학과 4학년 재학중이며, 부족하지만 많이 배우며 성장하고싶습니다.</p>
        </section>

        <section id="bb">
                <h2> ⚙️ 기술 스택 </h2>
                    <p><img src="Python.PNG" width="70"></p>
                    <p>- Python -</p><br>
                    <p><img src="SQL.PNG" width="50"></p>
                    <p>- SQL -</p>
        </section>
        
        <section id="cc">
                <h2> 취미 </h2>
                    <p><img src="OW.PNG" width="70"></p>
                    <p>- 게임 -</p><br>
                    <p><img src="WT.PNG" width="70"></p>
                    <p>- 웹툰 보기 -</p>
        </section>

        <section id="dd">
                <h2>자격증</h2>
                    <p>X</p>
        </section>
        <section id="ee">
            <h2> 방명록 </h2>

            <form>
                <div>
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
                </div>

                <br>

                <div>
                    <label for="message">내용</label>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="메시지를 입력하세요"></textarea>
                </div>

                <br>

                <button type="submit">등록</button>
            </form>
        </section>
    </main>

        <footer>
            <p>© 2026 지민제 </p>
            <p>Phone : 010 - 4482 - **** </p>
            <p>Email : alswp1342@gmail.com</p>
        </footer>
</body>
</html>
